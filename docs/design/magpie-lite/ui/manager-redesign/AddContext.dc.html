<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add a Claude Code context</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;border:0;padding:0;margin:0;background:none;color:inherit;cursor:pointer}
input{font:inherit;color:inherit;margin:0}
input::placeholder{color:#9a9aa3}
</style>
</helmet>
<div style="width: 460px; height: 320px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; padding: 24px; background: #26262a; color: #f3f3f5; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif; font-size: 13px; line-height: 1.4; overflow: hidden">

<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 15px; font-weight: 650">Add a Claude Code context</h1>
<p style="margin: 0; font-size: 12.5px; color: #b0b0b8; text-wrap: pretty">A context is a folder Claude Code runs from, chosen by CLAUDE_CONFIG_DIR. Each one keeps its own saved accounts.</p>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="ctx-folder" style="font-size: 12px; font-weight: 600; color: #d8d8de">Folder</label>
<div style="display: flex; gap: 8px">
<input id="ctx-folder" type="text" placeholder="~/.claude-work" style="flex: 1; min-width: 0; height: 32px; box-sizing: border-box; padding: 0 10px; border-radius: 7px; border: 1px solid rgba(255,255,255,0.16); background: #1b1b1e; font-family: 'SF Mono', 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; outline: 2px solid #4d8cff; outline-offset: 1px">
<button style="height: 32px; padding: 0 12px; border-radius: 7px; font-size: 12.5px; font-weight: 500; color: #f3f3f5; background: rgba(255,255,255,0.10)">Choose…</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="ctx-name" style="font-size: 12px; font-weight: 600; color: #d8d8de">Name <span style="font-weight: 400; color: #9a9aa3">optional</span></label>
<input id="ctx-name" type="text" placeholder="Defaults to the folder name" style="height: 32px; box-sizing: border-box; padding: 0 10px; border-radius: 7px; border: 1px solid rgba(255,255,255,0.16); background: #1b1b1e; font-size: 13px">
</div>

<div style="margin-top: auto; display: flex; justify-content: flex-end; gap: 8px">
<button style="height: 30px; padding: 0 14px; border-radius: 7px; font-size: 13px; font-weight: 500; color: #f3f3f5; background: rgba(255,255,255,0.10)">Cancel</button>
<button style="height: 30px; padding: 0 14px; border-radius: 7px; font-size: 13px; font-weight: 600; color: #ffffff; background: #2a66d9">Add context</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":460,"height":320}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
